[package]
name = "cruxvid"
version = "0.1.0"
edition = "2021"

[lib]
name = "cruxvid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "tls" for real Gemini (https); the fake Gemini in test mode is plain http.
ureq = { version = "2", default-features = false, features = ["tls"] }
base64 = "0.22"
# OS credential store (Windows Credential Manager) for the Gemini API key.
keyring = { version = "3", features = ["windows-native"] }

# Layout face detection (YuNet). Statically linked ONNX Runtime, no DLL to ship.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-24"] }

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

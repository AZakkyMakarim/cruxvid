[package]
name = "cruxvid"
version = "0.1.0"
edition = "2021"

[lib]
name = "cruxvid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# http only: the fake Gemini in test mode is plain http. Real Gemini (b2t.7) must enable the "tls" feature.
ureq = { version = "2", default-features = false }

[dev-dependencies]
jsonschema = { version = "0.30", default-features = false }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

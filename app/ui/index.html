<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cruxvid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Cruxvid</h1>

  <section id="source-panel">
    <h2 data-i18n="source"></h2>
    <input id="source-path" type="text" spellcheck="false">
    <button id="browse-btn" type="button"></button>
    <button id="analyze-btn" type="button"></button>
    <p id="token-estimate" role="status"></p>
    <p id="status" role="status"></p>
    <p id="error" role="alert"></p>
  </section>

  <section id="history-panel">
    <h2 id="history-title"></h2>
    <ul id="history-list"></ul>
    <p id="history-error" role="alert"></p>
  </section>

  <section id="clips-panel">
    <h2 data-i18n="clips"></h2>
    <p id="clip-controls">
      <label id="clip-order-label" for="clip-order"></label>
      <select id="clip-order"></select>
      <label id="clip-threshold-label" for="clip-threshold"></label>
      <input id="clip-threshold" type="range" min="0" max="100" step="1" value="50">
      <output id="clip-threshold-value" for="clip-threshold">50</output>
    </p>
    <ul id="clip-list"></ul>
  </section>

  <section id="settings-panel">
    <h2 data-i18n="settings"></h2>
    <label id="model-label" for="model-input"></label>
    <input id="model-input" type="text" spellcheck="false">
    <button id="model-save" type="button"></button>
    <span id="model-status" role="status"></span>
    <p>
      <span id="key-status" role="status"></span>
      <button id="key-change" type="button"></button>
      <button id="key-remove" type="button"></button>
    </p>
  </section>

  <dialog id="key-dialog">
    <h2 id="key-title"></h2>
    <p id="key-help"></p>
    <input id="key-input" type="password" autocomplete="off" spellcheck="false" aria-labelledby="key-title">
    <p id="key-error" role="alert"></p>
    <button id="key-save" type="button"></button>
    <button id="key-cancel" type="button"></button>
  </dialog>

  <section id="queue-panel">
    <h2 data-i18n="queue"></h2>
    <ul id="queue-picks"></ul>
    <button id="queue-export-btn" type="button" data-i18n="queueExportSelected"></button>
    <button id="queue-retry-btn" type="button" data-i18n="queueRetryFailed"></button>
    <p id="queue-error" role="alert"></p>
    <ul id="queue-jobs"></ul>
  </section>

  <section id="output-panel">
    <h2 data-i18n="outputFolder"></h2>
    <input id="output-dir" type="text" spellcheck="false">
    <button id="output-browse-btn" type="button" data-i18n="outputBrowse"></button>
    <button id="output-save-btn" type="button" data-i18n="outputSave"></button>
    <button id="open-folder-btn" type="button" data-i18n="openFolder"></button>
    <p id="output-msg" role="status"></p>
  </section>

  <footer id="diagnostics">
    <button id="test-btn" type="button">Run test</button>
    <span id="result" role="status"></span>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
